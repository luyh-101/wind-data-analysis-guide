<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">典型变速变桨机组的三个运行阶段</title>
  <desc id="desc">以切入风速和额定风速将风速轴分为三段。切入前通常不发电。切入后转速和功率上升，图示中的转速先趋稳，功率随后达到额定值。接近和超过额定风速时，变桨调节更明显。曲线仅表示原理。</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 12 6 0 12Z" fill="#526b65"/>
    </marker>
  </defs>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#17312e">
    <rect x="1" y="1" width="718" height="518" rx="16" fill="#f6faf8" stroke="#b8d1c9" stroke-width="2"/>
    <text x="360" y="43" font-size="29" font-weight="700" text-anchor="middle">原理示意，非实测数据</text>

    <path d="M104 63H247V445H104Z" fill="#e9eef2"/>
    <path d="M247 63H500V445H247Z" fill="#e6f2ea"/>
    <path d="M500 63H691V445H500Z" fill="#f7eddf"/>
    <path d="M104 63H247V127H104Z" fill="#dbe5ec"/>
    <path d="M247 63H500V127H247Z" fill="#d4eadc"/>
    <path d="M500 63H691V127H500Z" fill="#f1e0c8"/>
    <g font-size="25" font-weight="700" text-anchor="middle">
      <text x="175" y="102" fill="#3d5261">通常不发电</text>
      <text x="373" y="102" fill="#23594d">正常发电上升段</text>
      <text x="595" y="92" fill="#6d4e2e">额定附近及以上</text>
      <text x="595" y="117" fill="#6d4e2e" font-size="21" font-weight="400">控制更明显</text>
    </g>

    <path d="M104 227H691M104 335H691" stroke="#9aada5" stroke-width="1.3"/>
    <path d="M247 127V465M500 127V465" stroke="#647b75" stroke-width="2" stroke-dasharray="7 6"/>
    <g font-size="26" text-anchor="middle" font-weight="700">
      <text x="56" y="184" fill="#246b60">转速</text>
      <text x="56" y="291" fill="#275c85">功率</text>
      <text x="56" y="395" fill="#91431e">桨距角</text>
    </g>

    <path d="M118 208C161 208 202 208 247 202" fill="none" stroke="#246b60" stroke-width="3.5" stroke-dasharray="5 7" stroke-linecap="round"/>
    <path d="M247 202C310 200 348 166 414 166H678" fill="none" stroke="#246b60" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="414" cy="166" r="4.5" fill="#246b60"/>
    <text x="420" y="156" fill="#246b60" font-size="25">转速平台</text>

    <path d="M118 312H247C341 312 378 296 429 278C456 269 478 266 500 266H678" fill="none" stroke="#275c85" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="500" cy="266" r="4.5" fill="#275c85"/>
    <text x="599" y="255" fill="#275c85" font-size="25" text-anchor="middle">额定功率</text>

    <path d="M247 418H425C462 418 485 415 500 411C547 396 604 381 678 371" fill="none" stroke="#a0522b" stroke-width="4.5" stroke-linecap="round"/>
    <text x="512" y="360" fill="#91431e" font-size="24">变桨调节更明显</text>

    <path d="M104 445H692" stroke="#526b65" stroke-width="2" marker-end="url(#axis-arrow)"/>
    <g fill="#38544e" font-size="25" text-anchor="middle">
      <text x="247" y="493">切入风速</text>
      <text x="500" y="493">额定风速</text>
      <text x="663" y="493">风速</text>
    </g>
  </g>
</svg>
