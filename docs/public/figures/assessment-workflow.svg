<path d="M465 116H488" fill="none" stroke="#006c60" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M593 162V183" fill="none" stroke="#006c60" stroke-width="2.5" marker-end="url(#arrow)"/>
