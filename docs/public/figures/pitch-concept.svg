<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">风轮旋转、叶片变桨与桨距角的量法</title>
  <desc id="desc">A 区的三片叶片随风轮绕轮毂中心旋转。B 区的单片叶片绕从叶根到叶尖的长轴转动，视线从叶尖沿长轴指向叶根。C 区沿同一方向观察简化翼型截面，示出基准位置和当前截面方向的夹角。</desc>
  <defs>
    <path id="rotor-blade" d="M-9 0C-19-20-28-65-15-107C-10-123-3-133 3-135C6-120 0-97 4-71L10-5Z"/>
    <path id="airfoil" d="M-91 0Q-96-12-73-17C-29-28 41-15 95 0C37 4-31 14-69 10Q-88 7-91 0Z"/>
    <marker id="rotor-arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 13 6.5 0 13Z" fill="#246b60"/>
    </marker>
    <marker id="pitch-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 12 6 0 12Z" fill="#963e20"/>
    </marker>
    <marker id="sight-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 10 5 0 10Z" fill="#255a83"/>
    </marker>
  </defs>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#17312e">
    <rect x="1" y="1" width="718" height="488" rx="16" fill="#f6faf8" stroke="#b8d1c9" stroke-width="2"/>
    <rect x="16" y="15" width="307" height="460" rx="10" fill="#edf5f1"/>
    <rect x="336" y="15" width="368" height="191" rx="10" fill="#edf5f1"/>
    <rect x="336" y="220" width="368" height="255" rx="10" fill="#ebf3f9"/>
    <g font-size="29" font-weight="700">
      <text x="32" y="56">A 风轮旋转</text>
      <text x="352" y="56">B 叶片变桨</text>
      <text x="352" y="258">C 桨距角的量法</text>
    </g>

    <g transform="translate(169 244)">
      <g fill="#cbe7e0" stroke="#246b60" stroke-width="2.6" stroke-linejoin="round">
        <use href="#rotor-blade"/>
        <use href="#rotor-blade" transform="rotate(120)"/>
        <use href="#rotor-blade" transform="rotate(240)"/>
      </g>
      <path d="M-100-86A132 132 0 0 0-115 65" fill="none" stroke="#246b60" stroke-width="4" marker-end="url(#rotor-arrow)"/>
      <path d="M99-86A132 132 0 0 1 114 65" fill="none" stroke="#52756d" stroke-width="2" stroke-dasharray="5 7" opacity=".55"/>
      <circle r="16" fill="#246b60"/>
      <circle r="5" fill="#f6faf8"/>
    </g>
    <text x="169" y="406" font-size="25" text-anchor="middle">三片叶片绕轮毂中心旋转</text>

    <text x="352" y="86" font-size="24">叶片绕自身长轴转动</text>
    <path d="M368 123H399C445 103 533 113 608 133C566 142 491 153 400 141H368Z" fill="#cbe7e0" stroke="#246b60" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M355 133H608" stroke="#246b60" stroke-width="2" stroke-dasharray="7 5"/>
    <ellipse cx="550" cy="133" rx="8" ry="20" fill="#255a83" fill-opacity=".10" stroke="#255a83" stroke-width="1.8" stroke-dasharray="4 3"/>
    <path d="M463 119C455 107 460 98 470 98C489 98 495 156 478 161C472 163 465 156 464 147" fill="none" stroke="#963e20" stroke-width="3.5" marker-end="url(#pitch-arrow)"/>
    <path d="M664 133H617" fill="none" stroke="#255a83" stroke-width="3.5" marker-end="url(#sight-arrow)"/>
    <g font-size="23">
      <text x="367" y="181">叶根</text>
      <text x="559" y="181">叶尖</text>
      <text x="682" y="108" text-anchor="end" fill="#255a83">视线</text>
    </g>
    <path d="M664 151V221" fill="none" stroke="#255a83" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#sight-arrow)"/>

    <text x="352" y="290" font-size="23">沿叶片长轴观察（截面示意）</text>
    <g transform="translate(504 374)" fill="none">
      <use href="#airfoil" stroke="#617078" stroke-width="2.2" stroke-dasharray="6 5"/>
      <path d="M-91 0H95" stroke="#617078" stroke-width="2" stroke-dasharray="6 5"/>
      <g transform="rotate(-30)">
        <use href="#airfoil" fill="#b9dfd4" fill-opacity=".65" stroke="#246b60" stroke-width="2.5"/>
        <path d="M-91 0H95" stroke="#246b60" stroke-width="2.2"/>
      </g>
      <path d="M63 0A63 63 0 0 0 54.56-31.5" stroke="#963e20" stroke-width="3.5"/>
      <circle r="4.5" fill="#17312e"/>
    </g>
    <path d="M587 325L604 320M599 374L622 395" fill="none" stroke="#526b65" stroke-width="1.7"/>
    <g font-size="23">
      <text x="689" y="317" text-anchor="end" fill="#246b60">当前截面方向</text>
      <text x="686" y="418" text-anchor="end" fill="#52616b">基准位置</text>
      <text x="520" y="454" text-anchor="middle" fill="#963e20" font-size="26" font-weight="700">两者夹角为桨距角</text>
    </g>
  </g>
</svg>
